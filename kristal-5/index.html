<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kristal-5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Georgia, serif;
            background: #1f2f46;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 14px;
        }
        .logo {
            font-family: Arial, sans-serif;
            font-size: clamp(38px, 13vw, 56px);
            font-weight: 900;
            color: white;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-align: center;
        }
        .tagline {
            font-size: 16px;
            opacity: 0.75;
            margin-bottom: 42px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
            gap: 16px;
            width: min(980px, 100%);
        }
        .card {
            background: white;
            color: #222;
            padding: 30px 40px;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s;
            min-width: 140px;
        }
        .card:hover { transform: translateY(-4px); }
        .card .num {
            font-size: 42px;
            font-weight: 900;
            color: #1d559e;
            font-family: Arial, sans-serif;
        }
        .card .name {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        @media (max-width: 520px) {
            body { justify-content: flex-start; }
            .tagline { margin-bottom: 24px; }
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .card { min-width: 0; padding: 20px 8px; }
            .card .num { font-size: 32px; }
            .card .name { font-size: 11px; overflow-wrap: anywhere; }
        }
    </style>
</head>
<body>
    <div class="logo">kristal-5</div>
    <div class="tagline">Select site</div>
    <div class="grid">
        <a href="1/" class="card"><div class="num">01</div><div class="name">/kristal-5/1/</div></a>
        <a href="19/" class="card"><div class="num">02</div><div class="name">/kristal-5/19/</div></a>

        <a href="5/" class="card"><div class="num">05</div><div class="name">/kristal-5/5/</div></a>
        <a href="17/" class="card"><div class="num">06</div><div class="name">/kristal-5/17/</div></a>
        <a href="7/" class="card"><div class="num">07</div><div class="name">/kristal-5/7/</div></a>
        <a href="8/" class="card"><div class="num">08</div><div class="name">/kristal-5/8/</div></a>
        <a href="9/" class="card"><div class="num">09</div><div class="name">/kristal-5/9/</div></a>
        <a href="10/" class="card"><div class="num">10</div><div class="name">/kristal-5/10/</div></a>
        <a href="11/" class="card"><div class="num">11</div><div class="name">/kristal-5/11/</div></a>

        <a href="22/" class="card"><div class="num">22</div><div class="name">/kristal-5/22/</div></a>
    </div>
</body>
</html>
