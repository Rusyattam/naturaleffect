<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НОЖ - Analist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a2b48;
            color: white;
            font-family: Georgia, serif;
        }
        .logo {
            margin-bottom: 10px;
            color: white;
            font-family: "Arial Black", sans-serif;
            font-size: 72px;
            font-weight: 900;
            letter-spacing: -4px;
        }
        .tagline {
            margin-bottom: 50px;
            font-size: 16px;
            letter-spacing: 2px;
            opacity: 0.6;
            text-transform: uppercase;
        }
        .grid {
            width: min(900px, 100%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            min-width: 140px;
            padding: 30px 40px;
            border-radius: 4px;
            background: white;
            color: #222;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); }
        .card .num {
            color: #c39b6d;
            font-family: "Arial Black", sans-serif;
            font-size: 42px;
            font-weight: 900;
        }
        .card .name {
            margin-top: 4px;
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            .logo { font-size: 48px; letter-spacing: -2px; }
            .tagline { margin-bottom: 28px; }
            .grid { gap: 12px; }
            .card {
                width: calc(50% - 6px);
                min-width: 0;
                padding: 22px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="logo">НОЖ</div>
    <div class="tagline">Сайтни танланг</div>
    <div class="grid">
        <a href="1/" class="card"><div class="num">01</div><div class="name">/analist/1/</div></a>
        <a href="19/" class="card"><div class="num">02</div><div class="name">/analist/19/</div></a>
        <a href="14/" class="card"><div class="num">03</div><div class="name">/analist/14/</div></a>
        <a href="4/" class="card"><div class="num">04</div><div class="name">/analist/4/</div></a>
        <a href="5/" class="card"><div class="num">05</div><div class="name">/analist/5/</div></a>
        <a href="17/" class="card"><div class="num">06</div><div class="name">/analist/17/</div></a>
        <a href="7/" class="card"><div class="num">07</div><div class="name">/analist/7/</div></a>
        <a href="8/" class="card"><div class="num">08</div><div class="name">/analist/8/</div></a>
        <a href="9/" class="card"><div class="num">09</div><div class="name">/analist/9/</div></a>
        <a href="10/" class="card"><div class="num">10</div><div class="name">/analist/10/</div></a>
        <a href="11/" class="card"><div class="num">11</div><div class="name">/analist/11/</div></a>
        <a href="12/" class="card"><div class="num">12</div><div class="name">/analist/12/</div></a>
        <a href="13/" class="card"><div class="num">13</div><div class="name">/analist/13/</div></a>
    </div>
</body>
</html>
