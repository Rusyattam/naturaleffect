<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A9-3 Photos</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f2f4f7;
  color:#161616;
}
header{
  background:#1a2b48;
  color:#fff;
  padding:26px 18px;
  text-align:center;
}
h1{margin:0 0 8px;font-size:34px}
.back{color:#d9e5f7;text-decoration:none;border-bottom:1px solid rgba(217,229,247,.55)}
main{max-width:1120px;margin:0 auto;padding:24px 16px 40px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}
figure{
  margin:0;
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  overflow:hidden;
}
img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  display:block;
  background:#e8e8e8;
}
figcaption{
  padding:10px 12px;
  font-size:14px;
  color:#555;
  word-break:break-word;
}
</style>
</head>
<body>
<header>
  <h1>A9-3 Photos</h1>
  <a class="back" href="index.html">Back to catalog</a>
</header>
<main>
  <div class="grid">
    <figure><img src="images/1.jpg" alt=""><figcaption>1.jpg</figcaption></figure>
    <figure><img src="images/before-after2.jpg" alt=""><figcaption>before-after2.jpg</figcaption></figure>
    <figure><img src="images/sc5-img4.jpg" alt=""><figcaption>sc5-img4.jpg</figcaption></figure>
    <figure><img src="images/7.webp" alt=""><figcaption>7.webp</figcaption></figure>
    <figure><img src="images/sert-mf.jpg" alt=""><figcaption>sert-mf.jpg</figcaption></figure>
    <figure><img src="images/pack-mf.jpg" alt=""><figcaption>pack-mf.jpg</figcaption></figure>
    <figure><img src="images/ava1.jpg" alt=""><figcaption>ava1.jpg</figcaption></figure>
    <figure><img src="images/coms1.jpg" alt=""><figcaption>coms1.jpg</figcaption></figure>
    <figure><img src="images/coms4.jpg" alt=""><figcaption>coms4.jpg</figcaption></figure>
    <figure><img src="images/coms6.jpg" alt=""><figcaption>coms6.jpg</figcaption></figure>
    <figure><img src="images/berry-mixed-bowl.jpg" alt=""><figcaption>berry-mixed-bowl.jpg</figcaption></figure>
    <figure><img src="images/berry-mixed-dessert.jpg" alt=""><figcaption>berry-mixed-dessert.jpg</figcaption></figure>
  </div>
</main>
</body>
</html>
