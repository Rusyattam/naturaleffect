<title>A9-2 Catalog</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#1a2b48;
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px;
}
.logo{
  font-size:58px;
  font-weight:900;

}
.tagline{
  font-size:16px;
  opacity:.75;
  margin-bottom:36px;
  letter-spacing:2px;
  text-transform:uppercase;
}
.grid{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:920px;
}
.card{
  background:#fff;
  color:#222;
  padding:28px 38px;
  border-radius:4px;
  text-align:center;
  text-decoration:none;
  transition:transform .2s;
  min-width:140px;
}
.card:hover{transform:translateY(-4px)}
.num{
  font-size:42px;
  font-weight:900;
  color:#c39b6d;
}
.name{
  font-size:13px;
  color:#777;
  margin-top:4px;
}
@media(max-width:560px){
  .logo{font-size:38px}
  .card{width:100%}
}
</style>
</head>
